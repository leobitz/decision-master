[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-master"
version = "0.1.0"
description = "Fast inference for the Qwen3-based DecisionMaster variable-candidate decision model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.57,<5",
    "huggingface_hub>=0.34",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decision-master = "decision_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
